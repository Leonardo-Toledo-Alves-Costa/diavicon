<!--
  COMPONENTE: header
  Uso: título e subtítulo mudam por página (ex.: "Frente de Carbonatação
  no Concreto" / "Registros Fotográficos"). Logo é fixo.
  Placeholders: {{titulo_relatorio}}, {{subtitulo_pagina}}, {{logo_url}}
-->
<div class="report-header">
  <div class="titles">
    <h1>{{titulo_relatorio}}</h1>
    <h2>{{subtitulo_pagina}}</h2>
  </div>
  <div class="logo-block">
    <img src="{{logo_url}}" alt="DIAVICON">
    <!-- alternativa sem imagem (usa CSS puro), caso {{logo_url}} não esteja disponível:
    <div class="shield">DVC</div>
    <div class="logo-text">Dia<br><span>ViCon</span></div>
    -->
  </div>
</div>
<div class="header-underline"></div>
