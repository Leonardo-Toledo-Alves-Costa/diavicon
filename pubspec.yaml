name: diavicon
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Supabase
  supabase_flutter: ^2.12.2

  # Env
  flutter_dotenv: ^6.0.0

  # State management
  provider: ^6.1.5+1
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1

  # Navegação
  go_router: ^17.2.0

  # Formulários
  mask_text_input_formatter: ^2.9.0

  # Arquivos e mídia
  file_picker: ^11.0.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo_diavicon.png
    - assets/images/ic_linkedin.png
    - assets/images/ic_google.png
    - assets/images/pdf.png
    - assets/images/user.png
    - assets/images/project_placeholder1.png
    - assets/images/escudo_diavicon.png
    - assets/images/empresa.png
    - assets/images/obra.png