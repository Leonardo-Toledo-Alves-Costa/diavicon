name: diavicon
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
    


  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Supabase
  supabase_flutter: ^2.12.2

  # Env
  flutter_dotenv: ^6.0.0

  # State management
  provider: ^6.1.5+1
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  http: ^1.6.0
  google_maps_flutter: ^2.17.0
