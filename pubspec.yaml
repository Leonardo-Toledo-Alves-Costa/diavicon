name: diavicon
description: "A new Flutter project."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
    


  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Supabase
  supabase_flutter: ^2.12.2

  # Env
  flutter_dotenv: ^6.0.0

  # State management
  provider: ^6.1.5+1
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  http: ^1.6.0
  google_maps_flutter: ^2.17.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  image_cropper: ^12.2.1

  # Navegação
  go_router: ^17.2.0

  # Formulários
  mask_text_input_formatter: ^2.9.0

  # Arquivos e mídia
  file_picker: ^11.0.2
  pdfx: ^2.9.2
  internet_file: ^1.3.0
  flutter_colorpicker: ^1.1.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  syncfusion_flutter_charts: ^34.2.2

  flutter_html_to_pdf_plus: ^0.4.0
  path_provider: ^2.1.2
  open_filex: ^4.5.0

  # Navegação

  # Formulários

  # Arquivos e mídia

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.3.13" # Adicione esta linha
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: "assets/images/logo_app.png"
  android: true
  ios: true

# Adicione estas linhas para a tela de carregamento (Splash)
flutter_native_splash:
  color: "#FFFFFF" # Cor de fundo da tela de carregamento (Branco)
  image: "assets/images/logo_app.png" # A mesma logo
  android: true
  ios: true

