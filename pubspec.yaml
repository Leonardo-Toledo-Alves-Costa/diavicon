name: diavicon
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.2
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  go_router: ^17.2.0
  file_picker: ^11.0.2
  riverpod: ^3.2.1
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.2.2
  http: ^1.6.0
  google_maps_flutter: ^2.17.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo_diavicon.png
    - assets/images/ic_linkedin.png
    - assets/images/ic_google.png
    - assets/images/pdf.png
    - assets/images/user.png
    - assets/images/project_placeholder1.png
    - assets/images/escudo_diavicon.png
    - assets/images/empresa.png
    - assets/images/obra.png
    - assets/images/user-star.png
    - assets/images/elemento_info.png
    - assets/images/planta_elementos_info.png
    - assets/images/co2_1.png
    - assets/images/frame_135.png
    - assets/images/voltage_1.png
    - assets/images/
