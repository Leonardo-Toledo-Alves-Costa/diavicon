
[functions.convidar-funcionario]
enabled = true
verify_jwt = true
import_map = "./functions/convidar-funcionario/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/convidar-funcionario/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/convidar-funcionario/*.html" ]

[auth]
additional_redirect_urls = ["diavicon://login-callback", "diavicon://nova-senha"]

[auth.email]
enable_confirmations = true

[functions.auth-operations]
verify_jwt = true
entrypoint = "./functions/auth-operations/index.ts"
